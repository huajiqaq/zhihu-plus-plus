org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1200000
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

android.enableR8.fullMode=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
kotlin.compiler.execution.strategy=daemon

org.gradle.caching=true

ksp.incremental=true

org.gradle.parallel=true
org.gradle.workers.max=2

app.versionName=0.32
app.versionCode=751

org.gradle.tooling.parallel=true

# macOS Native 的 Compose 仍属实验功能，需显式启用以渲染共享 ZhihuMain 组合树。
org.jetbrains.compose.experimental.macos.enabled=true
