name: Feature Request
description: 提交功能建议或体验改进想法。
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        标题用一句话说明主要建议，每个 issue 只提一个独立问题。
        请填写使用场景、当前问题和预期改进；信息不足的建议可能被关闭。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先描述当前遇到的不便、痛点或缺失。
      placeholder: "例如：评论区筛选能力不够，查找特定内容时效率很低。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改进？
      description: 描述你理想中的功能或交互。
      placeholder: "例如：希望增加按作者、关键词或时间范围筛选评论的能力。"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 这个功能在什么情况下会被使用？为什么值得做？
      placeholder: "例如：在长评论串里定位某类回复时会经常用到。"
    validations:
      required: true

  - type: textarea
    id: official-path
    attributes:
      label: 官方操作路径（如果官方有此功能）
      description: 请描述如何在官方知乎网页端或 App 中找到并使用该功能，包括需要点击的按钮和操作步骤。
      placeholder: |
        例如：
        1. 打开知乎 App → 进入任意一个回答
        2. 点击右上角「...」按钮
        3. 选择「xxx」即可看到该功能
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方案
      description: 如果你已经有 workaround，或者考虑过其他设计，请写在这里（可选）。

  - type: input
    id: app-version
    attributes:
      label: 知乎++ 版本
      description: 可以在账号设置页面长按版本号复制。
      placeholder: "例如：22"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他补充
      description: 截图、参考链接或补充说明（可选）。
