name: Prepare build inputs
description: Configure Gradle and install the host SDK and locked Tiqian generation tools
inputs:
  upstream-tools:
    description: Install locked generation tools for builds that consume Tiqian sources
    required: false
    default: 'true'
  native-cache-scope:
    description: Native build stage used to select the closest compatible cache
    required: false
    default: default
outputs:
  native-cache-key:
    description: Key for saving Kotlin Native state after a successful build
    value: ${{ steps.native_cache.outputs.cache-primary-key }}
  native-cache-hit:
    description: Whether the exact Kotlin Native cache was restored
    value: ${{ steps.native_cache.outputs.cache-hit }}
  native-cache-writable:
    description: Whether this job may save Kotlin Native state
    value: ${{ runner.os == 'macOS' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
runs:
  using: composite
  steps:
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Identify compatible Kotlin Native cache
      if: runner.os == 'macOS'
      id: native_key
      shell: bash
      env:
        NATIVE_CACHE_SCOPE: ${{ inputs.native-cache-scope }}
      run: |
        python -I - <<'PY'
        import hashlib, os, subprocess, tomllib
        from pathlib import Path
        kotlin = tomllib.loads(Path('gradle/libs.versions.toml').read_text())['versions']['kotlin']
        xcode = hashlib.sha256(subprocess.check_output(['xcodebuild', '-version'])).hexdigest()[:16]
        compatible = f"{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}-{kotlin}-{xcode}-"
        job, stage = os.environ['GITHUB_JOB'], os.environ['NATIVE_CACHE_SCOPE']
        scope = f"konan-v3-{compatible}{job}-{stage}-"
        key = scope + os.environ['GITHUB_SHA']
        # v2 debug- also matches debug-release-: both contain Debug, never Release-only.
        legacy_stage = {
            ('macos-native', 'debug'): 'macos-native-debug',
            ('macos-native', 'release'): 'macos-native-debug-release',
            ('ios-release', 'release'): 'ios-acceptance-release',
            ('ios-simulator-build', 'simulator-build'): 'ios-acceptance-simulator',
            ('build-desktop', 'release'): 'build-desktop-release',
        }.get((job, stage))
        legacy_scope = f"konan-v2-{compatible}{legacy_stage}-" if legacy_stage else ''
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'scope={scope}\nkey={key}\nlegacy-scope={legacy_scope}\n')
        PY
    - name: Restore Kotlin Native
      if: runner.os == 'macOS'
      id: native_cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan
        key: ${{ steps.native_key.outputs.key }}
        restore-keys: |
          ${{ steps.native_key.outputs.scope }}
          ${{ steps.native_key.outputs.legacy-scope }}
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Read Haxe version
      if: inputs.upstream-tools == 'true'
      id: haxe
      shell: bash
      run: |
        python -I -c 'import json; from pathlib import Path; version = json.loads(Path("gradle/upstream-sources.lock.json").read_text(encoding="utf-8"))["sources"]["tiqian-core"]["generation"]["haxeVersion"]; print("version=" + version)' >> "$GITHUB_OUTPUT"
    - name: Set up Haxe
      if: inputs.upstream-tools == 'true'
      uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb
      with:
        haxe-version: ${{ steps.haxe.outputs.version }}
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Prepare locked generation tools
      if: inputs.upstream-tools == 'true'
      shell: bash
      run: python -I .github/scripts/prepare-tiqian-toolchain.py --output "$RUNNER_TEMP/zhihu-tiqian-toolchain" --env "$GITHUB_ENV"
