name: Nightly Builds

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/my-build-action.yml
    if: startsWith(github.ref, 'refs/heads/')
    with:
      name: 'Nightly Builds'
      nightly_release: true
    secrets: inherit
  release:
    uses: ./.github/workflows/my-build-action.yml
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    with:
      name: 'Release'
      release: true
    secrets: inherit
