name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: '验收范围：all 完整检查，web 仅构建 Web，ios 仅重验 iOS'
        type: choice
        required: false
        default: all
        options: [all, web, ios]
      ios_stage:
        description: 'iOS 阶段：all 完整验收；单项仅用于定向重验'
        type: choice
        required: false
        default: all
        options: [all, release, simulator]
      apple_release:
        description: '验收 Apple Release 与隔离 iOS Simulator UI（仅 Actions artifacts，不发布）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pull-request-check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.checks || 'all' }}-${{ inputs.ios_stage || 'all' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      desktop: ${{ steps.scope.outputs.desktop }}
      macos: ${{ steps.scope.outputs.macos }}
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify pull request changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHECKS: ${{ inputs.checks || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          desktop=true
          macos=true
          rust=true
          web=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_CHECKS" == ios ]]; then
            scope=ios
            desktop=false
            macos=false
            rust=false
            web=false
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_CHECKS" == web ]]; then
            scope=web
            desktop=false
            macos=false
            rust=false
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pr-changed-paths"
            desktop=false
            macos=false
            rust=false
            web=false
            docs_only=true
            android_tests_only=true
            web_only=true
            changed=false
            while IFS= read -r -d '' path; do
              changed=true
              if [[ "$path" == *$'\n'* || "$path" == *$'\r'* ]]; then
                docs_only=false; android_tests_only=false; web_only=false
                desktop=true; macos=true; rust=true; web=true
                continue
              fi
              case "$path" in
                README.md|CONTRIBUTING.md|CHANGELOG.md|CLAUDE.md|AGENTS.md|docs/*.md|webApp/README.md|.agents/skills/*.md|.github/PULL_REQUEST_TEMPLATE.md)
                  : ;;
                webApp/*|misc/zhihu-web-bridge/*|shared*/src/wasmJs*|.github/workflows/pages.yml)
                  docs_only=false; android_tests_only=false; web=true ;;
                app/src/androidTest/*)
                  docs_only=false; web_only=false ;;
                *)
                  docs_only=false
                  android_tests_only=false
                  web_only=false
                  case "$path" in
                    app/src/full/*|rs-hf-tokenizer/*|sentence_embeddings/*)
                      rust=true ;;
                    app/src/*|shared*/src/android*)
                      : ;;
                    desktopApp/*|shared*/src/jvm*)
                      desktop=true ;;
                    macosApp/*|macosUiDebug/*|shared*/src/macos*|shared*/src/native*|shared*/src/apple*|shared*/src/ios*)
                      macos=true ;;
                    shared*/src/*)
                      desktop=true; macos=true; web=true ;;
                    *)
                      desktop=true; macos=true; rust=true; web=true ;;
                  esac ;;
              esac
              case "$path" in
                shared-domain/src/*/nlp/*|shared-feature-feed/src/*/viewmodel/local/*)
                  rust=true ;;
              esac
            done < "$RUNNER_TEMP/pr-changed-paths"
            if [[ "$changed" == false ]]; then
              desktop=true; macos=true; rust=true; web=true
            elif [[ "$docs_only" == true ]]; then
              scope=docs
            elif [[ "$android_tests_only" == true ]]; then
              scope=android-tests
            elif [[ "$web_only" == true ]]; then
              scope=web
            fi
          fi
          printf 'scope=%s\ndesktop=%s\nmacos=%s\nrust=%s\nweb=%s\n' "$scope" "$desktop" "$macos" "$rust" "$web" >> "$GITHUB_OUTPUT"
          printf 'Required checks: %s; desktop=%s, macOS=%s, Rust/JNI=%s, Web=%s\n' "$scope" "$desktop" "$macos" "$rust" "$web" >> "$GITHUB_STEP_SUMMARY"

  build_pr:
    name: Build PR
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'android-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Prepare build inputs
        uses: ./.github/actions/setup-build-inputs

      - name: Check formatting and build Lite APKs
        run: ./gradlew ktlintCheck :app:assembleLiteDebug :app:assembleLiteDebugAndroidTest --continue --max-workers=2

      - name: Prepare Lite debug APK
        run: |
          mkdir -p app/build/upload
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/upload/zhihu++-lite-debug.apk

      - name: Upload Lite debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PR Debug artifacts
          path: app/build/upload/

      - name: Prepare instrumented test APKs
        run: |
          mkdir -p app/build/instrument-apks
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/instrument-apks/app.apk
          cp app/build/outputs/apk/androidTest/lite/debug/app-lite-debug-androidTest.apk app/build/instrument-apks/test.apk

      - name: Upload instrumented test APKs
        uses: actions/upload-artifact@v7
        with:
          name: Instrumented test APKs
          path: app/build/instrument-apks/
          retention-days: 1

  wasm:
    name: Web production build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: ./.github/actions/setup-build-inputs
        with:
          upstream-tools: 'false'
      - name: Check browser bridge boundaries
        run: node --test misc/zhihu-web-bridge/bridge.test.mjs
      - name: Build static Web distribution
        run: bash ./gradlew -PzhihuUpstreamPatches=false -Pkotlin.daemon.jvmargs=-Xmx4g :webApp:wasmJsBrowserDistribution --max-workers=2
      - uses: actions/upload-artifact@v7
        with:
          name: Web production distribution
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Application JVM regressions
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Prepare build inputs
        uses: ./.github/actions/setup-build-inputs

      - name: Install CJK fonts for text shaping tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}\n' ':lang=zh-cn'

      - name: Install Linux desktop helper build dependencies
        if: needs.changes.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libspeechd-dev libglib2.0-dev libjson-glib-dev

      - name: Run application regressions and compile selected desktop host
        env:
          RUN_DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          set -euo pipefail
          tasks=(:app:testLiteDebugUnitTest :build-logic:test)
          if [[ "$RUN_DESKTOP" == true ]]; then
            tasks+=(:desktopApp:classes)
          fi
          reports=(app/build/test-results/testLiteDebugUnitTest build-logic/build/test-results/test)
          for build_script in shared/build.gradle.kts shared-*/build.gradle.kts; do
            [[ -f "$build_script" ]] || continue
            module="${build_script%%/*}"
            if [[ -n "$(find "$module/src" -type f \( -path '*/commonTest/*' -o -path '*/jvmTest/*' \) \( -name '*.kt' -o -name '*.java' \) -print -quit)" ]]; then
              tasks+=(":$module:jvmTest")
              reports+=("$module/build/test-results/jvmTest")
            else
              printf '%s\n' "$module:jvmTest: NO-SOURCE，不计为测试通过" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          ./gradlew "${tasks[@]}" -PzhihuAndroidVariant=lite -PzhihuUpstreamPatches=true --continue --max-workers=2
          python3 -I .github/scripts/verify-test-results.py "${reports[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PR Test Reports
          path: |
            app/build/reports
            app/build/test-results
            build-logic/build/reports
            build-logic/build/test-results
            shared*/build/reports
            shared*/build/test-results
            .gradle/upstream-inputs/*/provenance.json
          include-hidden-files: true
          if-no-files-found: error

  rust-verification:
    name: Rust and Android JNI Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Prepare build inputs
        uses: ./.github/actions/setup-build-inputs

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Add Rust components and Android targets
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Check and test Rust
        working-directory: rs-hf-tokenizer
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --color never 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/rust-tests.log"

      - name: Run Full app JVM tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./gradlew :app:testFullDebugUnitTest -PzhihuAndroidVariant=full -PzhihuUpstreamPatches=true --continue --max-workers=2
          python3 -I .github/scripts/verify-test-results.py app/build/test-results/testFullDebugUnitTest

      - name: Build tokenizer AAR and test APK
        if: ${{ !cancelled() }}
        id: tokenizer_apks
        run: ./gradlew :sentence_embeddings:assembleDebug :sentence_embeddings:assembleDebugAndroidTest -PzhihuAndroidVariant=full -PzhihuUpstreamPatches=true --max-workers=2

      - name: Enable KVM
        if: ${{ !cancelled() && steps.tokenizer_apks.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test HFTokenizer JNI on emulator
        if: ${{ !cancelled() && steps.tokenizer_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :sentence_embeddings:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ml.shubham0204.sentence_embeddings.HFTokenizerInstrumentedTest -PzhihuAndroidVariant=full -PzhihuUpstreamPatches=true --max-workers=2

      - name: Verify JNI tests ran
        if: ${{ !cancelled() && steps.tokenizer_apks.outcome == 'success' }}
        run: python3 -I .github/scripts/verify-test-results.py sentence_embeddings/build/outputs/androidTest-results --class-name com.ml.shubham0204.sentence_embeddings.HFTokenizerInstrumentedTest

      - name: Upload JNI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HFTokenizer JNI Test Reports
          path: |
            app/build/reports/tests/testFullDebugUnitTest/**
            app/build/test-results/testFullDebugUnitTest/**
            sentence_embeddings/build/reports/androidTests/**
            sentence_embeddings/build/outputs/androidTest-results/**
            ${{ runner.temp }}/rust-tests.log
          if-no-files-found: error

  macos-native:
    name: macOS Native Compile and Tests (${{ matrix.stage }})
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.checks == 'all' && inputs.apple_release && '["debug","release"]' || '["debug"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Prepare build inputs
        id: native_inputs
        uses: ./.github/actions/setup-build-inputs
        with:
          native-cache-scope: ${{ matrix.stage }}

      - name: Compile offscreen host and run native-specific regressions
        id: native_compile
        if: matrix.stage == 'debug'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          tasks=(:macosApp:macosArm64Test :macosUiDebug:packageDebugMacosUiDebug)
          reports=(macosApp/build/test-results/macosArm64Test)
          for build_script in shared/build.gradle.kts shared-*/build.gradle.kts; do
            [[ -f "$build_script" ]] || continue
            module="${build_script%%/*}"
            if [[ -n "$(find "$module/src" -type f \( -path '*/macosTest/*' -o -path '*/nativeTest/*' -o -path '*/appleTest/*' \) -name '*.kt' -print -quit)" ]]; then
              tasks+=(":$module:macosArm64Test")
              reports+=("$module/build/test-results/macosArm64Test")
            fi
          done
          /usr/bin/time -lp ./gradlew "${tasks[@]}" -PzhihuAndroidVariant=lite -PzhihuUpstreamPatches=true --profile --continue --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          python3 -I .github/scripts/verify-test-results.py "${reports[@]}"
          echo 'Native-specific suites ran here; common-only suites run on JVM.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run isolated offscreen native smoke without a window
        id: native_smoke
        if: ${{ !cancelled() && matrix.stage == 'debug' && steps.native_inputs.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/verify-test-results.py \
            --smoke-binary 'macosUiDebug/build/bin/macosArm64/debugApp/ZhihuPlusPlusUiDebug.app/Contents/MacOS/ZhihuPlusPlusUiDebug' \
            --smoke-output "$RUNNER_TEMP/macos-native-smoke/login"
          python3 -I .github/scripts/verify-test-results.py \
            --smoke-binary 'macosUiDebug/build/bin/macosArm64/debugApp/ZhihuPlusPlusUiDebug.app/Contents/MacOS/ZhihuPlusPlusUiDebug' \
            --smoke-root main --smoke-output "$RUNNER_TEMP/macos-native-smoke/main"

      - name: Verify macOS Release package without launching a window
        id: native_release
        if: matrix.stage == 'release'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          /usr/bin/time -lp ./gradlew :macosApp:packageReleaseMacosApp :macosUiDebug:verifyMacosReleaseIsolation \
            -PzhihuAndroidVariant=lite -PzhihuUpstreamPatches=true --profile --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8"
          app_bundle='macosApp/build/bin/macosArm64/releaseApp/Zhihu++.app'
          output="$RUNNER_TEMP/macos-release-acceptance"
          mkdir -p "$output"
          extracted="$(mktemp -d "$RUNNER_TEMP/zhihu-release-unpack.XXXXXX")"
          /usr/bin/file "$app_bundle/Contents/MacOS/ZhihuPlusPlus" | tee "$output/binary.txt" | grep -q 'Mach-O 64-bit executable arm64'
          /usr/bin/codesign --verify --deep --strict "$app_bundle"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$output/zhihu++-macos-arm64.app.zip"
          /usr/bin/ditto -x -k "$output/zhihu++-macos-arm64.app.zip" "$extracted"
          /usr/bin/codesign --verify --deep --strict "$extracted/Zhihu++.app"
          cmp "$app_bundle/Contents/MacOS/ZhihuPlusPlus" "$extracted/Zhihu++.app/Contents/MacOS/ZhihuPlusPlus"
          shasum -a 256 "$output/zhihu++-macos-arm64.app.zip" > "$output/SHA256SUMS"
          printf '%s\n' 'macOS Release resources, ad-hoc signature, archive round-trip and protocol isolation verified. Release GUI was not launched; no notarization or public release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS Release acceptance package
        if: matrix.stage == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: macOS Release Acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-release-acceptance/
          if-no-files-found: error

      - name: Save Kotlin Native after successful stage checks
        if: >-
          success() && steps.native_inputs.outputs.native-cache-writable == 'true' && steps.native_inputs.outputs.native-cache-hit != 'true' &&
          ((matrix.stage == 'debug' && steps.native_compile.outcome == 'success' && steps.native_smoke.outcome == 'success') ||
          (matrix.stage == 'release' && steps.native_release.outcome == 'success'))
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.native_inputs.outputs.native-cache-key }}

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS Native Test Reports-${{ matrix.stage }}-${{ github.run_attempt }}
          path: |
            shared*/build/reports/tests/macosArm64Test/**
            shared*/build/test-results/macosArm64Test/**
            macosApp/build/reports/tests/macosArm64Test/**
            macosApp/build/test-results/macosArm64Test/**
            build/reports/profile/**
            .gradle/upstream-inputs/*/provenance.json
            ${{ runner.temp }}/macos-native-smoke/**
          include-hidden-files: true
          if-no-files-found: error

  ios-release:
    name: iOS Acceptance (release)
    if: github.event_name == 'workflow_dispatch' && ((inputs.checks == 'all' && inputs.apple_release) || inputs.checks == 'ios') && inputs.ios_stage != 'simulator'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      IOS_STAGE: release
    steps:
      - uses: actions/checkout@v7

      - &ios_jdk
        name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true

      - &ios_inputs
        name: Prepare build inputs
        id: ios_inputs
        uses: ./.github/actions/setup-build-inputs
        with:
          native-cache-scope: ${{ env.IOS_STAGE }}

      - name: Verify unsigned Release app and IPA
        id: ios_acceptance
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 -I .github/scripts/verify-ios-acceptance.py --stage "$IOS_STAGE" \
            --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ios-acceptance-$IOS_STAGE"

      - &ios_cache_save
        name: Save Kotlin Native after successful compilation
        if: ${{ !cancelled() && steps.ios_inputs.outputs.native-cache-writable == 'true' && steps.ios_inputs.outputs.native-cache-hit != 'true' && steps.ios_acceptance.outputs.native-build-succeeded == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.ios_inputs.outputs.native-cache-key }}

      - &ios_evidence
        name: Upload isolated iOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iOS Acceptance-${{ env.IOS_STAGE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-acceptance-${{ env.IOS_STAGE }}/
          if-no-files-found: error

  ios-simulator-build:
    name: iOS Acceptance (simulator build)
    if: github.event_name == 'workflow_dispatch' && ((inputs.checks == 'all' && inputs.apple_release) || inputs.checks == 'ios') && inputs.ios_stage != 'release'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      IOS_STAGE: simulator-build
    outputs:
      artifact-id: ${{ steps.products.outputs.artifact-id }}
      products-sha256: ${{ steps.ios_acceptance.outputs.products-sha256 }}
    steps:
      - uses: actions/checkout@v7
      - *ios_jdk
      - *ios_inputs
      - name: Build relocatable XCTest products
        id: ios_acceptance
        run: |
          set -euo pipefail
          python3 -I .github/scripts/verify-ios-acceptance.py --self-check
          chmod +x ./gradlew
          python3 -I .github/scripts/verify-ios-acceptance.py --stage "$IOS_STAGE" --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ios-acceptance-$IOS_STAGE" --handoff "$RUNNER_TEMP/ios-simulator-products"

      - name: Upload simulator test products
        id: products
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-simulator-products/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - *ios_cache_save
      - *ios_evidence

  ios-simulator-test:
    name: iOS Acceptance (simulator test)
    needs: ios-simulator-build
    runs-on: macos-26
    timeout-minutes: 120
    env:
      IOS_STAGE: simulator-test
      PRODUCTS_ID: ${{ needs.ios-simulator-build.outputs.artifact-id }}
      PRODUCTS_SHA256: ${{ needs.ios-simulator-build.outputs.products-sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the successful producer's immutable artifact ID and payload digest
        run: '[[ "$PRODUCTS_ID" =~ ^[1-9][0-9]*$ && "$PRODUCTS_SHA256" =~ ^[0-9a-f]{64}$ ]]'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.PRODUCTS_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/ios-simulator-products
      - name: Test verified simulator products without building
        run: |
          python3 -I .github/scripts/verify-ios-acceptance.py --stage "$IOS_STAGE" --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ios-acceptance-$IOS_STAGE" --handoff "$RUNNER_TEMP/ios-simulator-products"
      - *ios_evidence

  mock-instrumented-shards:
    name: Mock Instrumented Shard (${{ matrix.shard_label }}/2)
    needs:
      - changes
      - build_pr
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'android-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download instrumented test APKs
        uses: actions/download-artifact@v8
        with:
          name: Instrumented test APKs
          path: app/build/instrument-apks

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mock-mode androidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTRUMENT_APP_APK: app/build/instrument-apks/app.apk
          INSTRUMENT_TEST_APK: app/build/instrument-apks/test.apk
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          avd-name: zhihu-pr
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # 分栏与字形手柄用例使用启动时确定的平板视口。
          pre-emulator-launch-script: >-
            sed -i
            -e 's/^hw\.lcd\.width[[:space:]]*=.*/hw.lcd.width=900/'
            -e 's/^hw\.lcd\.height[[:space:]]*=.*/hw.lcd.height=1600/'
            -e 's/^hw\.lcd\.density[[:space:]]*=.*/hw.lcd.density=240/'
            "$ANDROID_AVD_HOME/zhihu-pr.avd/config.ini"
          script: |
            adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
            bash .github/scripts/run-instrumented-shard.sh 2 ${{ matrix.shard_index }}

      - name: Upload shard test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mock-instrumented-shard-${{ matrix.shard_label }}
          path: app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  android-instrument-tests:
    name: Mock Instrumented Tests
    if: always()
    needs:
      - changes
      - build_pr
      - unit-tests
      - wasm
      - rust-verification
      - macos-native
      - ios-release
      - ios-simulator-build
      - ios-simulator-test
      - mock-instrumented-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pull request checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_SCOPE: ${{ needs.changes.outputs.scope }}
          RUN_DESKTOP: ${{ needs.changes.outputs.desktop }}
          RUN_RUST: ${{ needs.changes.outputs.rust }}
          RUN_MACOS: ${{ needs.changes.outputs.macos }}
          RUN_WEB: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.wasm.result }}
          BUILD_RESULT: ${{ needs.build_pr.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
          RUST_RESULT: ${{ needs.rust-verification.result }}
          MACOS_RESULT: ${{ needs.macos-native.result }}
          RUN_APPLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.apple_release == true && inputs.checks == 'all' }}
          RUN_IOS: ${{ github.event_name == 'workflow_dispatch' && ((inputs.checks == 'all' && inputs.apple_release == true) || inputs.checks == 'ios') }}
          IOS_STAGE: ${{ inputs.ios_stage || 'all' }}
          IOS_RELEASE_RESULT: ${{ needs.ios-release.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-simulator-build.result }}
          IOS_TEST_RESULT: ${{ needs.ios-simulator-test.result }}
          SHARD_RESULT: ${{ needs.mock-instrumented-shards.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CHECK_SCOPE" in
            full)
              android_result=success
              cross_platform_result=success ;;
            android-tests)
              android_result=success
              cross_platform_result=skipped ;;
            docs|ios|web)
              android_result=skipped
              cross_platform_result=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$BUILD_RESULT" "$SHARD_RESULT"; do
            test "$result" = "$android_result"
          done
          test "$UNIT_TEST_RESULT" = "$cross_platform_result"
          for selected in "$RUN_DESKTOP" "$RUN_RUST" "$RUN_MACOS"; do
            [[ "$selected" == true || "$selected" == false ]]
            if [[ "$CHECK_SCOPE" != full ]]; then test "$selected" = false; fi
          done
          rust_result=skipped
          macos_result=skipped
          if [[ "$RUN_RUST" == true ]]; then rust_result=success; fi
          if [[ "$RUN_MACOS" == true ]]; then macos_result=success; fi
          test "$RUST_RESULT" = "$rust_result"
          test "$MACOS_RESULT" = "$macos_result"
          web_result=skipped
          case "$RUN_WEB" in
            true)
              [[ "$CHECK_SCOPE" == full || "$CHECK_SCOPE" == web ]]
              web_result=success ;;
            false) test "$CHECK_SCOPE" != web ;;
            *) exit 1 ;;
          esac
          test "$WEB_RESULT" = "$web_result"
          ios_release=skipped
          ios_simulator=skipped
          case "$RUN_IOS" in
            true)
              [[ "$CHECK_SCOPE" == full || "$CHECK_SCOPE" == ios ]]
              case "$IOS_STAGE" in
                all) ios_release=success; ios_simulator=success ;;
                release) ios_release=success ;;
                simulator) ios_simulator=success ;;
                *) exit 1 ;;
              esac ;;
            false) test "$CHECK_SCOPE" != ios ;;
            *) exit 1 ;;
          esac
          test "$IOS_RELEASE_RESULT" = "$ios_release"
          test "$IOS_BUILD_RESULT" = "$ios_simulator"
          test "$IOS_TEST_RESULT" = "$ios_simulator"
          case "$RUN_APPLE_RELEASE" in
            true)
              test "$CHECK_SCOPE" = full
              test "$MACOS_RESULT" = success
              test "$RUN_IOS" = true ;;
            false) [[ "$CHECK_SCOPE" != full || "$RUN_IOS" == false ]] ;;
            *) exit 1 ;;
          esac
