name: Final Android Focus Evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focus:
    if: github.repository == 'huajiqaq/zhihu-plus-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '45606549034'
          name: Instrumented test APKs
          path: ${{ runner.temp }}/original-apks
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Replay failed shard with unchanged original APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          avd-name: zhihu-pr
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          pre-emulator-launch-script: >-
            sed -i
            -e 's/^hw\.lcd\.width[[:space:]]*=.*/hw.lcd.width=900/'
            -e 's/^hw\.lcd\.height[[:space:]]*=.*/hw.lcd.height=1600/'
            -e 's/^hw\.lcd\.density[[:space:]]*=.*/hw.lcd.density=240/'
            "$ANDROID_AVD_HOME/zhihu-pr.avd/config.ini"
          script: |
            adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
            python3 -I .github/scripts/focus-environment.py "$RUNNER_TEMP/original-apks" "$RUNNER_TEMP/focus-environment" ${{ matrix.shard }}
      - name: Save original results and focus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final Focus Evidence ${{ matrix.shard }}
          path: ${{ runner.temp }}/focus-environment/**
          if-no-files-found: error
          retention-days: 3
