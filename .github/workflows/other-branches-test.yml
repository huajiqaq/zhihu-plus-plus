name: Build Check
on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  build_pr:
    name: Build PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 将当前日期写入环境变量。
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 将仓库名写入环境变量。
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # 可选发行版见 setup-java 的 Supported distributions。
          java-version: '21'
          cache: 'gradle'
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ./.gradle
            ./**/.gradle
          key: gradle-cache-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/upstream-sources.lock.json') }}
      - name: Prepare build inputs
        uses: ./.github/actions/setup-build-inputs
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Run KtLint
        run: ./gradlew ktlintCheck
      - name: Build Full App
        # 构建 APK。
        run: bash ./gradlew :app:assembleFullDebug -PzhihuAndroidVariant=full -PzhihuUpstreamPatches=true --max-workers=2
      - name: Build Lite App
        run: bash ./gradlew :app:assembleLiteDebug -PzhihuAndroidVariant=lite -PzhihuUpstreamPatches=true --max-workers=2
      - name: Move files
        run: |
          mkdir -p app/build/upload
          mkdir -p app/build/upload-lite
          mv app/build/outputs/apk/full/debug/app-full-debug.apk app/build/upload/zhihu++-full-debug.apk
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/upload/zhihu++-lite-debug.apk
          mv app/build/outputs/apk/lite/debug/app-lite-debug.apk app/build/upload-lite/zhihu++-lite-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PR Debug artifacts
          path: app/build/upload/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PR Debug artifacts (Lite)
          path: app/build/upload-lite/
