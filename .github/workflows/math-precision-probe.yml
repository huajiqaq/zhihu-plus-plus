name: Linux Math Precision Probe

on:
  push:
    branches:
      - ci/apple-glass-full-check
    paths:
      - .github/workflows/math-precision-probe.yml

permissions:
  contents: read

jobs:
  math-probe:
    if: github.repository == 'huajiqaq/zhihu-plus-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIQIAN_UPDATE_GOLDEN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Prepare fixed build inputs
        uses: ./.github/actions/setup-build-inputs
      - name: Run unmodified Linux Skia suite
        id: suite
        run: |
          bash ./gradlew :upstream-tiqian-math:platforms:jvm:skia:jvmTest \
            -PzhihuUpstreamPatches=true -PzhihuAndroidVariant=lite -PtiqianUpstreamSkiko=true --max-workers=2
      - name: Record the actual Linux snapshot
        if: ${{ !cancelled() }}
        env:
          ZHIHU_MATH_PROBE: ${{ github.workspace }}/.github/scripts/math-precision-probe/MathPrecision.java
        run: |
          mkdir -p "$RUNNER_TEMP/math-precision"
          bash ./gradlew :upstream-tiqian-math:platforms:jvm:skia:captureMathPrecision \
            --init-script .github/scripts/math-precision-probe/capture.gradle \
            -PzhihuUpstreamPatches=true -PzhihuAndroidVariant=lite -PtiqianUpstreamSkiko=true --max-workers=2
      - name: Upload original suite report and measured data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Linux Math Precision
          path: |
            ${{ runner.temp }}/math-precision/**
            .gradle/upstream-inputs/*/provenance.json
            .gradle/upstream-inputs/*/sources/tiqian-math/platforms/jvm/skia/build/test-results/jvmTest/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Require the original test verdict
        if: ${{ !cancelled() }}
        env:
          SUITE_RESULT: ${{ steps.suite.outcome }}
        run: test "$SUITE_RESULT" = success
