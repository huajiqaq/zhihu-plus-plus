name: Remaining Android Fixtures

on:
  push:
    branches: [ci/apple-glass-full-check]
    paths: [.github/workflows/remaining-fixtures.yml]

permissions:
  contents: read

jobs:
  fixtures:
    if: github.repository == 'huajiqaq/zhihu-plus-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: ./.github/actions/setup-build-inputs
      - name: Build candidate APKs
        run: bash ./gradlew :app:assembleLiteDebug :app:assembleLiteDebugAndroidTest -PzhihuAndroidVariant=lite -PzhihuUpstreamPatches=true --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run only the five remaining original cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          avd-name: zhihu-pr
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          pre-emulator-launch-script: >-
            sed -i
            -e 's/^hw\.lcd\.width[[:space:]]*=.*/hw.lcd.width=900/'
            -e 's/^hw\.lcd\.height[[:space:]]*=.*/hw.lcd.height=1600/'
            -e 's/^hw\.lcd\.density[[:space:]]*=.*/hw.lcd.density=240/'
            "$ANDROID_AVD_HOME/zhihu-pr.avd/config.ini"
          script: |
            adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
            python3 -I .github/scripts/remaining-fixtures.py "$RUNNER_TEMP/remaining-fixtures"
      - name: Archive synthetic fixture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remaining Android Fixture Evidence
          path: ${{ runner.temp }}/remaining-fixtures/**
          if-no-files-found: error
          retention-days: 3
