on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      args:
        required: false
        type: string
      release:
        required: false
        type: boolean
      nightly_release:
        required: false
        type: boolean
    secrets:
      ANDROID_SIGNING_KEY:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true

      - name: Prepare build inputs
        id: desktop_inputs
        uses: ./.github/actions/setup-build-inputs
        with:
          native-cache-scope: release

      - name: Change wrapper permissions
        shell: bash
        run: chmod +x ./gradlew

      - name: Set desktop artifact suffix
        id: desktop_suffix
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "suffix=macos-arm64" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
          esac
          case "$RUNNER_OS" in
            Linux) os="linux" ;;
            Windows) os="windows" ;;
            *) os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          echo "suffix=$os-$arch" >> "$GITHUB_OUTPUT"

      - name: Install Linux reading and AppImage build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libspeechd-dev libglib2.0-dev libjson-glib-dev \
            speech-dispatcher speech-dispatcher-espeak-ng patchelf pax-utils

      - name: Build desktop release app-image
        if: runner.os != 'macOS'
        shell: bash
        run: ./gradlew ${{ inputs.args }} :desktopApp:createReleaseDistributable

      - name: Package Windows MSI with installer-owned notification registration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_SUFFIX: ${{ steps.desktop_suffix.outputs.suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'zhihu-release-msi'
          & ./.github/scripts/package-windows-msi.ps1 `
            -AppImage 'desktopApp/build/compose/binaries/main-release/app/Zhihu++' `
            -OutputDirectory $output
          New-Item -ItemType Directory -Path desktopApp/build/upload -Force | Out-Null
          Copy-Item -Path (Join-Path $output '*.msi') -Destination "desktopApp/build/upload/zhihu++-desktop-$env:ARTIFACT_SUFFIX.msi"

      - name: Package Linux AppImage with private reading libraries
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ steps.desktop_suffix.outputs.suffix }}
        run: |
          python -I .github/scripts/package-linux-appimage.py \
            --app-image 'desktopApp/build/compose/binaries/main-release/app/Zhihu++' \
            --icon desktopApp/src/main/composeResources/drawable/desktop_icon.png \
            --output "desktopApp/build/upload/zhihu++-desktop-$ARTIFACT_SUFFIX.AppImage"

      - name: Upload desktop package
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-desktop-${{ steps.desktop_suffix.outputs.suffix }}
          path: desktopApp/build/upload/*
          if-no-files-found: error

      - name: Build and package macOS Kotlin/Native app
        id: macos_package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/time -lp ./gradlew -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" ${{ inputs.args }} --profile :macosApp:packageReleaseMacosApp :macosUiDebug:verifyMacosReleaseIsolation

          app_bundle="macosApp/build/bin/macosArm64/releaseApp/Zhihu++.app"
          app_executable="$app_bundle/Contents/MacOS/ZhihuPlusPlus"
          app_archive="desktopApp/build/upload/zhihu++-desktop-${{ steps.desktop_suffix.outputs.suffix }}.app.zip"
          extracted_dir="$RUNNER_TEMP/zhihu-native-release"

          test -d "$app_bundle"
          /usr/bin/file "$app_executable" | grep -q 'Mach-O 64-bit executable arm64'
          /usr/bin/codesign --verify --deep --strict "$app_bundle"

          mkdir -p desktopApp/build/upload
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$app_archive"
          /usr/bin/ditto -x -k "$app_archive" "$extracted_dir"
          /usr/bin/codesign --verify --deep --strict "$extracted_dir/Zhihu++.app"

      - name: Save Kotlin Native after successful packaging
        if: ${{ always() && !cancelled() && runner.os == 'macOS' && steps.desktop_inputs.outputs.native-cache-writable == 'true' && steps.desktop_inputs.outputs.native-cache-hit != 'true' && steps.macos_package.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.desktop_inputs.outputs.native-cache-key }}

      - name: Upload macOS build profile
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: macOS-build-profile-${{ inputs.name }}
          path: build/reports/profile/
          if-no-files-found: warn

      - name: Upload macOS Kotlin/Native app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-desktop-${{ steps.desktop_suffix.outputs.suffix }}
          path: desktopApp/build/upload/zhihu++-desktop-${{ steps.desktop_suffix.outputs.suffix }}.app.zip

  build:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./rs-hf-tokenizer/target/
          key: rust-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-cache-
      - name: Prepare build inputs
        uses: ./.github/actions/setup-build-inputs

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
      - name: Build App
        run: |
          if [[ "$PUBLISH_RELEASE" == "true" && -z "${signingKey//[[:space:]]/}" ]]; then
            printf '%s\n' 'A signing key is required to publish Android release artifacts.' >&2
            exit 1
          fi
          bash ./gradlew ${{inputs.args}} assembleFullRelease
          bash ./gradlew ${{inputs.args}} assembleLiteRelease
        env:
          PUBLISH_RELEASE: ${{ inputs.release || inputs.nightly_release }}
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Move files
        run: |
          mkdir -p app/build/upload
          mv app/build/outputs/apk/full/release/app-full-release*.apk app/build/upload/zhihu++-full.apk
          mv app/build/outputs/apk/lite/release/app-lite-release*.apk app/build/upload/zhihu++-lite.apk
      - name: Compress lite mapping file
        run: |
          mkdir -p app/build/upload
          zip app/build/upload/mapping-lite.zip app/build/outputs/mapping/liteRelease/mapping.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-android
          path: app/build/upload/
          if-no-files-found: error

  publish:
    name: Collect and publish builds
    needs: [build-desktop, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Set repository name as env variable
        run: echo "repository_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Download Android apps
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.name }}-android
          path: app/build/upload

      - name: Download desktop apps
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.name }}-desktop-*
          path: app/build/upload
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.date_today }} - ${{ env.repository_name }} - ${{ inputs.name }}
          path: app/build/upload/
          if-no-files-found: error

      # 删除现有 nightly 发布。
      - name: Delete existing nightly release
        if: ${{ inputs.nightly_release }}
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = 'nightly';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            for (const release of releases.filter(r => r.tag_name === tagName)) {
              core.info(`Deleting nightly release ${release.id} (${release.name || release.tag_name})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              core.info(`Deleted tag ${tagName}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`Tag ${tagName} does not exist`);
              } else {
                throw error;
              }
            }

      # 生成 nightly 更新记录。
      - name: Generate nightly changelog
        if: ${{ inputs.nightly_release }}
        id: nightly_changelog
        uses: actions/github-script@v9
        with:
          script: |
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // 查找最近的非 nightly 标签。
            const lastReleaseTag = tags.find(t => t.name !== 'nightly');
            let since;
            if (lastReleaseTag) {
              const { data: tagCommit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lastReleaseTag.commit.sha,
              });
              since = tagCommit.commit.committer.date;
            } else {
              // 没有发布标签时仅回溯 24 小时。
              since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: since,
              per_page: 50,
            });

            if (commits.length === 0) {
              return 'No changes since last release.';
            }

            const lines = [];
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0];
              const sha = c.sha.substring(0, 7);
              lines.push(`- ${msg} (${sha})`);
            }

            if (lastReleaseTag) {
              return `**Changes since ${lastReleaseTag.name}:**\n\n` + lines.join('\n');
            } else {
              return `**Recent changes:**\n\n` + lines.join('\n');
            }
          result-encoding: string

      # 创建新的 nightly 发布。
      - name: Create Nightly Release
        if: ${{ inputs.nightly_release }}
        id: nightly_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build (${{ env.date_today }})
          body: |
            Nightly build generated on ${{ env.date_today }}

            ${{ steps.nightly_changelog.outputs.result }}
          files: |
            app/build/upload/zhihu++-lite.apk
            app/build/upload/mapping-lite.zip
            app/build/upload/zhihu++-full.apk
            app/build/upload/zhihu++-desktop-*.AppImage
            app/build/upload/zhihu++-desktop-*.msi
            app/build/upload/zhihu++-desktop-*.app.zip
          fail_on_unmatched_files: true
          prerelease: true
      - name: Generate release notes
        if: ${{ inputs.release && startsWith(github.ref, 'refs/tags/') }}
        id: release_notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            console.log(data.body);
            return data.body;
          result-encoding: string

      - name: Create Release
        if: ${{ inputs.release && startsWith(github.ref, 'refs/tags/') }}
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            如果要使用，请下载最新的 APK 文件进行安装。不需要下载 mapping.zip，除非你是开发人员且需要调试混淆后的代码。
            桌面端提供 Windows MSI 安装包与 Linux AppImage，内置 Java 运行时，下载安装即可使用，无需另外安装 Java。
            Full 版本包含 AI 功能和 AI 模型，可处理NLP任务；Lite 版本体积更小，只有不到 4 MB 的大小。

            > 关于Full和Lite两个版本的说明：
            > Full版本包含了一个onnx框架，可以在端侧进行离线AI推理，支持基于LLM embedding的智能内容过滤功能，
            > Lite版本不支持智能内容过滤，但体积更小，性能更好。您可以根据自己的需求选择下载哪个版本。

            ${{ steps.release_notes.outputs.result }}
          files: |
            app/build/upload/zhihu++-lite.apk
            app/build/upload/mapping-lite.zip
            app/build/upload/zhihu++-full.apk
            app/build/upload/zhihu++-desktop-*.AppImage
            app/build/upload/zhihu++-desktop-*.msi
            app/build/upload/zhihu++-desktop-*.app.zip
          fail_on_unmatched_files: true
          prerelease: false
